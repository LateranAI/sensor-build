name: Build

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            binary: proctor
          - os: windows-latest
            name: windows
            binary: proctor.exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: LateranAI/proctor-svc
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Get commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set pending status
        run: |
          gh api repos/LateranAI/proctor-svc/statuses/${{ steps.sha.outputs.sha }} \
            -f state=pending \
            -f context="build/${{ matrix.name }}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Build in progress"
        env:
          GH_TOKEN: ${{ secrets.PROCTOR_STATUS_TOKEN }}

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool ninja nasm

      - name: Install NASM
        if: runner.os != 'macOS'
        uses: ilammy/setup-nasm@v1

      - name: Setup MSYS2 MinGW
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja autoconf automake libtool make

      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "$(cygpath -m /mingw64/bin)" >> "$GITHUB_PATH"

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v5
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ matrix.name }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'e5a1490e1409d175932ef6014519e9ae149ddb7c'

      - name: Prepare vcpkg binary cache directory
        run: mkdir -p "${{ github.workspace }}/vcpkg-cache"

      - name: Configure CMake
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
        run: |
          cmake_args=(-B build -S . -G Ninja
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            -DCMAKE_BUILD_TYPE=Release)

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cmake_args+=(
              -DVCPKG_TARGET_TRIPLET=x64-mingw-static
              -DVCPKG_HOST_TRIPLET=x64-mingw-static
              -DCMAKE_C_COMPILER=gcc
              -DCMAKE_CXX_COMPILER=g++
            )
          fi

          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare artifacts & clean build folder
        run: |
          mkdir -p staging
          cp "build/${{ matrix.binary }}" staging/

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Bundle any required MinGW runtime DLLs
            MINGW_BIN="$(dirname "$(which gcc)")"
            for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
              [[ -f "$MINGW_BIN/$dll" ]] && cp "$MINGW_BIN/$dll" staging/
            done
            # Copy any DLLs produced by the build
            find build -maxdepth 1 -name '*.dll' -exec cp {} staging/ \; 2>/dev/null || true
          fi
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cp build/crashpad_handler staging/
          fi

          # Remove unrelated files prior to Sentry DIF upload, CMake not used after this
          rm -Rf build/CMakeFiles build/vcpkg_installed

      - name: Upload debug symbols to Sentry
        run: |
          npm install -g @sentry/cli
          sentry-cli debug-files upload build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proctor-${{ matrix.name }}
          path: staging/

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.name }}-${{ github.run_id }}

      - name: Set final status
        if: always()
        run: |
          state=${{ job.status == 'success' && 'success' || 'failure' }}
          gh api repos/LateranAI/proctor-svc/statuses/${{ steps.sha.outputs.sha }} \
            -f state="$state" \
            -f context="build/${{ matrix.name }}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Build $state"
        env:
          GH_TOKEN: ${{ secrets.PROCTOR_STATUS_TOKEN }}

name: Build

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            binary: proctor
          - os: windows-latest
            name: windows
            binary: proctor.exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: LateranAI/proctor-svc
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool ninja nasm

      - name: Install NASM
        if: runner.os != 'macOS'
        uses: ilammy/setup-nasm@v1

      - name: Setup MSYS2 MinGW
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja autoconf automake libtool make

      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "$(cygpath -m /mingw64/bin)" >> "$GITHUB_PATH"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable vcpkg binary caching
        run: |
          echo "ACTIONS_CACHE_URL=$ACTIONS_CACHE_URL" >> "$GITHUB_ENV"
          echo "ACTIONS_RUNTIME_TOKEN=$ACTIONS_RUNTIME_TOKEN" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> "$GITHUB_ENV"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'e5a1490e1409d175932ef6014519e9ae149ddb7c'

      - name: Configure CMake
        run: |
          cmake_args=(-B build -S . -G Ninja
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            -DCMAKE_C_COMPILER_LAUNCHER=sccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
            -DCMAKE_BUILD_TYPE=Release)

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cmake_args+=(
              -DVCPKG_TARGET_TRIPLET=x64-mingw-static
              -DVCPKG_HOST_TRIPLET=x64-mingw-static
              -DCMAKE_C_COMPILER=gcc
              -DCMAKE_CXX_COMPILER=g++
            )
          fi

          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare artifacts
        run: |
          mkdir -p staging
          cp "build/${{ matrix.binary }}" staging/

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Bundle any required MinGW runtime DLLs
            MINGW_BIN="$(dirname "$(which gcc)")"
            for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
              [[ -f "$MINGW_BIN/$dll" ]] && cp "$MINGW_BIN/$dll" staging/
            done
            # Copy any DLLs produced by the build
            find build -maxdepth 1 -name '*.dll' -exec cp {} staging/ \; 2>/dev/null || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proctor-${{ matrix.name }}
          path: staging/
